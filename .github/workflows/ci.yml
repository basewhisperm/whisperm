name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration safety check
        run: |
          if grep -rn "DROP TABLE" prisma/migrations/ || grep -rn "DROP COLUMN" prisma/migrations/ || grep -rn "TRUNCATE" prisma/migrations/; then
            echo "DESTRUCTIVE MIGRATION DETECTED - halt deployment"
            exit 1
          fi
          echo "Migration safety check passed - expand-only confirmed"


      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Strict typecheck
        run: pnpm typecheck:strict

      - name: Test
        run: pnpm test
